apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: default
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db-portfolio:5432/portfolio_db"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SERVER_PORT: "8083"
---
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: default
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "portfolio_user"
  SPRING_DATASOURCE_PASSWORD: "portfolio_pass"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-portfolio
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-portfolio
  template:
    metadata:
      labels:
        app: db-portfolio
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: portfolio_db
            - name: POSTGRES_USER
              value: portfolio_user
            - name: POSTGRES_PASSWORD
              value: portfolio_pass
          volumeMounts:
            - name: portfolio-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: portfolio-storage
          persistentVolumeClaim:
            claimName: portfolio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-portfolio
  namespace: default
spec:
  selector:
    app: db-portfolio
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-service
  template:
    metadata:
      labels:
        app: portfolio-service
    spec:
      containers:
        - name: portfolio-service
          image: manuel123s/portfolio-service:1.0
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: default
spec:
  selector:
    app: portfolio-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP