apiVersion: v1
kind: ConfigMap
metadata:
  name: market-data-config
  namespace: default
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db-market-data:5432/market_data_db"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SERVER_PORT: "8084"
---
apiVersion: v1
kind: Secret
metadata:
  name: market-data-secrets
  namespace: default
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "market_user"
  SPRING_DATASOURCE_PASSWORD: "market_pass"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-market-data
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-market-data
  template:
    metadata:
      labels:
        app: db-market-data
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: market_data_db
            - name: POSTGRES_USER
              value: market_user
            - name: POSTGRES_PASSWORD
              value: market_pass
          volumeMounts:
            - name: market-data-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: market-data-storage
          persistentVolumeClaim:
            claimName: market-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-market-data
  namespace: default
spec:
  selector:
    app: db-market-data
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      labels:
        app: market-data-service
    spec:
      containers:
        - name: market-data-service
          image: manuel123s/market-data-service:1.0
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: market-data-config
            - secretRef:
                name: market-data-secrets
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
  namespace: default
spec:
  selector:
    app: market-data-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP