# Zookeeper es el coordinador de Kafka
# Kafka lo usa para saber qué brokers están vivos y gestionar particiones
# Debe arrancar ANTES que Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: default
spec:
  replicas: 1  # Zookeeper solo necesita 1 réplica en desarrollo
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          # imagen oficial de Confluent — la misma que usas en docker-compose.yml
          image: confluentinc/cp-zookeeper:7.6.1
          ports:
            - containerPort: 2181  # puerto estándar de Zookeeper
          env:
            # puerto en el que Zookeeper escucha conexiones de Kafka
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            # intervalo de heartbeat en milisegundos
            # Zookeeper usa esto para detectar si un nodo murió
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"

---
# Service de Zookeeper — Kafka lo llama por nombre zookeeper:2181
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: default
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  type: ClusterIP  # solo accesible dentro del cluster — solo Kafka lo necesita