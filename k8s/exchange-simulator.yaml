# Exchange Simulator no tiene base de datos propia
# Solo necesita Kafka para publicar trades
# Un solo Deployment y Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-simulator
  namespace: default
spec:
  replicas: 1  # solo 1 réplica — si hubiera más, generarían trades duplicados
  selector:
    matchLabels:
      app: exchange-simulator
  template:
    metadata:
      labels:
        app: exchange-simulator
    spec:
      containers:
        - name: exchange-simulator
          image: manuel123s/exchange-simulator:1.0
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SERVER_PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exchange-simulator
  namespace: default
spec:
  selector:
    app: exchange-simulator
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP