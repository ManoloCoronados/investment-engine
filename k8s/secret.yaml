# secret.yaml
# Secret almacena variables SENSIBLES — passwords, tokens, API keys
# Kubernetes los encripta en etcd automáticamente
# Nunca van en ConfigMap porque ConfigMap no está encriptado
apiVersion: v1
kind: Secret
metadata:
  name: trade-ingestion-secrets  # nombre único — el Deployment lo referencia exactamente así
  namespace: default
type: Opaque  # tipo genérico para passwords y tokens arbitrarios
# Kubernetes tiene otros tipos para certificados TLS o tokens Docker
stringData:
  # stringData permite escribir valores en texto plano
  # Kubernetes hace el encode a base64 automáticamente al guardarlo
  # Si usaras 'data' tendrías que encodear manualmente — stringData es más limpio
  SPRING_DATASOURCE_USERNAME: "trade_user"
  SPRING_DATASOURCE_PASSWORD: "trade_pass"

