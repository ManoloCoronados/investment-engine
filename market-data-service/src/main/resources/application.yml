spring:
  application:
    name: market-data-service

  datasource:
    url: jdbc:postgresql://localhost:5435/market_data_db
    username: market_user
    password: market_pass
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

kafka:
  topics:
    prices-updated: prices.updated

scheduler:
  price:
    interval-ms: 3000

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.investmentengine.marketdata: INFO
    org.apache.kafka: WARN