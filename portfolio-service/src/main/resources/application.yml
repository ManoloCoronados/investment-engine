spring:
  application:
    name: portfolio-service

  datasource:
    url: jdbc:postgresql://localhost:5433/portfolio_db
    username: portfolio_user
    password: portfolio_pass
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

kafka:
  topics:
    trades-processed: trades.processed
    portfolio-updated: portfolio.updated

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.investmentengine.portfolio: INFO
    org.apache.kafka: WARN